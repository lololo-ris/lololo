<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOLOLO | 摄影存档</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        body { margin: 0; padding: 0; background: #ffffff; color: #1c1917; overflow-x: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .dynamic-text {
            background: linear-gradient(to right, #4a00e0, #ff0080, #f05a28, #4a00e0);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientMove 4s linear infinite;
        }

        .masonry-grid { column-count: 1; column-gap: 2.5rem; }
        @media (min-width: 768px) { .masonry-grid { column-count: 2; } }
        @media (min-width: 1280px) { .masonry-grid { column-count: 3; } }
        .masonry-item { break-inside: avoid; margin-bottom: 4rem; position: relative; }
        
        .img-container { position: relative; overflow: hidden; border-radius: 1.25rem; background: #f8f8f8; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); min-height: 250px; cursor: zoom-in; }
        .img-container:hover { transform: translateY(-8px); box-shadow: 0 40px 80px -15px rgba(0,0,0,0.12); }
        .img-container img { transition: all 1.5s cubic-bezier(0.16, 1, 0.3, 1); filter: grayscale(1); opacity: 0; }
        .img-container img.loaded { opacity: 1; }
        .img-container:hover img { filter: grayscale(0); transform: scale(1.08); }

        .loading-spinner { border: 2px solid #eee; border-top: 2px solid #db2777; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .dot-active { background: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
        .dot-warning { background: #f59e0b; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }

        .share-btn { transition: all 0.3s ease; }
        .share-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // 云数据库与云存储配置 (已内置示例 Key)
        const CLOUD_KEY = "$2a$10$nNS2rKkHobU8mal0z.ClCOp/rlj1SAB0Q5vjokxTmVZwBtyWVDXES";
        const CLOUD_ID = "6944c1ee43b1c97be9f83cd6";
        const WORDS = ["FOCUS", "VISION", "POETIC", "MOMENT", "SOUL"];
        const MAX_BYTES = 100 * 1024; 

        const App = () => {
            const [photos, setPhotos] = useState([]);
            const [contact, setContact] = useState({ 
                instagram: '@_joy.5', 
                email: 'lololo_1@qq.com',
                cloudinaryName: '', 
                cloudinaryPreset: 'lololo' 
            });
            const [isAdmin, setIsAdmin] = useState(false);
            const [syncing, setSyncing] = useState(false);
            const [wordIndex, setWordIndex] = useState(0);
            const [clickCount, setClickCount] = useState(0);
            const [selectedPhoto, setSelectedPhoto] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            const [toasts, setToasts] = useState([]);

            const usedSize = useMemo(() => JSON.stringify({ photos, contact }).length, [photos, contact]);
            const usedPercent = Math.min(100, (usedSize / MAX_BYTES * 100)).toFixed(1);
            const isCloudEnabled = !!(contact.cloudinaryName && contact.cloudinaryPreset);

            // Toast 消息系统
            const addToast = (msg, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, msg, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };

            useEffect(() => {
                const auth = localStorage.getItem('lololo_auth') === 'true';
                setIsAdmin(auth);
                fetchData();
                const timer = setInterval(() => setWordIndex(p => (p + 1) % WORDS.length), 3500);
                return () => clearInterval(timer);
            }, []);

            // 监听数据加载完成后的深层链接跳转
            useEffect(() => {
                if (photos.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    const photoId = params.get('p');
                    if (photoId) {
                        const target = photos.find(p => p.id.toString() === photoId);
                        if (target) setSelectedPhoto(target);
                    }
                }
            }, [photos]);

            const fetchData = async () => {
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_ID}/latest?nocache=${Date.now()}`, {
                        headers: { 'X-Master-Key': CLOUD_KEY }
                    });
                    const data = await res.json();
                    if (data.record) {
                        setPhotos(data.record.photos || []);
                        setContact(data.record.contact || contact);
                    }
                } catch (e) { addToast("获取数据库失败", "error"); }
            };

            const save = async (newPhotos, newContact) => {
                const p = newPhotos || photos;
                const c = newContact || contact;
                const payload = JSON.stringify({ photos: p, contact: c });
                
                if (payload.length > MAX_BYTES) {
                    addToast("数据库容量已达上限", "error");
                    return false;
                }

                setSyncing(true);
                try {
                    const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': CLOUD_KEY },
                        body: payload
                    });
                    if (res.ok) {
                        setPhotos(p);
                        setContact(c);
                        addToast("同步成功", "success");
                        return true;
                    }
                } catch (e) { addToast("云端同步失败", "error"); }
                finally { setSyncing(false); }
                return false;
            };

            const handleUpload = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setSyncing(true);
                try {
                    if (!isCloudEnabled) {
                        addToast("请先配置 Cloudinary", "error");
                        setShowSettings(true);
                        setSyncing(false);
                        return;
                    }

                    const formData = new FormData();
                    formData.append('file', file);
                    formData.append('upload_preset', contact.cloudinaryPreset);
                    
                    const uploadRes = await fetch(`https://api.cloudinary.com/v1_1/${contact.cloudinaryName}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const uploadData = await uploadRes.json();
                    
                    if (uploadData.error) throw new Error(uploadData.error.message);

                    const title = prompt("作品标题:") || "UNTITLED";
                    const subTitle = prompt("描述信息 (可选):") || "";
                    
                    const newPhotos = [{ 
                        id: Date.now(), 
                        url: uploadData.secure_url, 
                        caption: title, 
                        subCaption: subTitle,
                        date: new Date().toLocaleDateString() 
                    }, ...photos];
                    
                    await save(newPhotos);
                } catch (err) {
                    addToast(`上传报错: ${err.message}`, "error");
                } finally {
                    setSyncing(false);
                    e.target.value = "";
                }
            };

            const copyShareLink = (id) => {
                const url = new URL(window.location.href);
                url.searchParams.set('p', id);
                navigator.clipboard.writeText(url.toString());
                addToast("分享链接已复制", "success");
            };

            const toggleAdmin = () => {
                const n = clickCount + 1;
                setClickCount(n);
                if (n >= 5) {
                    const next = !isAdmin;
                    setIsAdmin(next);
                    localStorage.setItem('lololo_auth', next);
                    addToast(next ? "管理员模式: 已激活" : "管理员模式: 已注销", "success");
                    setClickCount(0);
                }
                setTimeout(() => setClickCount(0), 2000);
            };

            return (
                <div className="min-h-screen flex flex-col font-sans selection:bg-pink-100 selection:text-pink-600">
                    {/* Toast 容器 */}
                    <div className="fixed bottom-10 left-1/2 -translate-x-1/2 z-[200] space-y-3 w-[90%] max-w-sm pointer-events-none">
                        {toasts.map(t => (
                            <div key={t.id} className={`toast-enter px-6 py-4 rounded-2xl shadow-2xl text-[10px] font-black uppercase tracking-widest text-white border-b-4 ${t.type === 'error' ? 'bg-red-600 border-red-800' : t.type === 'success' ? 'bg-black border-pink-600' : 'bg-black border-stone-800'}`}>
                                {t.msg}
                            </div>
                        ))}
                    </div>

                    <nav className="fixed top-0 w-full z-50 bg-white/70 backdrop-blur-3xl border-b border-stone-50 px-10 py-6 flex justify-between items-center">
                        <div onClick={toggleAdmin} className="text-2xl font-black tracking-tighter cursor-pointer flex items-center gap-2 select-none">
                            <span className={`status-dot ${isCloudEnabled ? 'dot-active' : 'dot-warning'}`}></span>
                            <span className="uppercase italic">LOLOLO</span>
                        </div>
                        <div className="flex gap-12 text-[10px] font-black uppercase tracking-[0.2em] text-stone-400">
                            {isAdmin && (
                                <button onClick={() => setShowSettings(true)} className="text-pink-600 hover:text-black transition-colors font-bold">Manage</button>
                            )}
                            <a href="#gallery" className="hover:text-black transition-colors">Archive</a>
                            <a href="#contact" className="hover:text-black transition-colors">Contact</a>
                        </div>
                    </nav>

                    {showSettings && (
                        <div className="fixed inset-0 z-[60] bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 animate-fade" onClick={() => setShowSettings(false)}>
                            <div className="bg-white w-full max-w-2xl p-10 rounded-[3rem] shadow-2xl" onClick={e => e.stopPropagation()}>
                                <h3 className="text-3xl font-black italic uppercase tracking-tighter mb-8">System Admin</h3>
                                <div className="space-y-6">
                                    <div className="space-y-4">
                                        <div className="group">
                                            <label className="text-[9px] font-bold text-stone-400 uppercase mb-1 block ml-1">Cloudinary Name</label>
                                            <input className="w-full bg-stone-50 border border-stone-100 rounded-2xl px-6 py-4 text-base font-bold outline-none focus:border-pink-500 transition-colors" value={contact.cloudinaryName} onChange={e => setContact({...contact, cloudinaryName: e.target.value})} placeholder="云存储账户名" />
                                        </div>
                                        <div className="group">
                                            <label className="text-[9px] font-bold text-stone-400 uppercase mb-1 block ml-1">Unsigned Preset</label>
                                            <input className="w-full bg-stone-50 border border-stone-100 rounded-2xl px-6 py-4 text-base font-bold outline-none focus:border-pink-500 transition-colors" value={contact.cloudinaryPreset} onChange={e => setContact({...contact, cloudinaryPreset: e.target.value})} placeholder="上传预设名称" />
                                        </div>
                                    </div>
                                    <button onClick={() => { save(null, contact); setShowSettings(false); }} className="w-full bg-black text-white py-6 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-pink-600 transition-all shadow-xl">保存配置</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <header className="h-[95vh] flex flex-col justify-center items-center text-center bg-white px-8">
                        <div className="animate-fade">
                            <p className="text-[12px] font-black tracking-[1em] text-stone-200 mb-14 uppercase italic">Vercel Performance</p>
                            <h1 className="text-8xl md:text-[14rem] font-black tracking-tighter leading-[0.75] italic">
                                <span className="text-stone-100 uppercase">Archive</span><br/>
                                <span key={wordIndex} className="dynamic-text inline-block uppercase animate-fade">
                                    {WORDS[wordIndex]}
                                </span>
                            </h1>
                        </div>
                    </header>

                    <section id="gallery" className="py-48 bg-stone-950 text-white">
                        <div className="max-w-[1800px] mx-auto px-10">
                            <div className="flex flex-col md:flex-row justify-between items-end gap-16 mb-40">
                                <div>
                                    <h2 className="text-[8rem] lg:text-[10rem] font-black uppercase tracking-tighter italic leading-none opacity-90">Work</h2>
                                    <p className="mt-8 text-stone-500 tracking-[0.5em] font-black text-xs uppercase italic">{photos.length} Captured Scenes</p>
                                </div>
                                {isAdmin && (
                                    <div className="flex flex-col items-end gap-6">
                                        <label className={`px-12 py-6 font-black text-xs uppercase rounded-full transition-all cursor-pointer flex items-center gap-4 shadow-xl ${syncing ? 'bg-stone-800 text-stone-500' : 'bg-white text-black hover:bg-pink-600 hover:text-white'}`}>
                                            {syncing && <div className="loading-spinner"></div>}
                                            {syncing ? "上传中..." : "新增作品"}
                                            <input type="file" hidden accept="image/*" onChange={handleUpload} disabled={syncing} />
                                        </label>
                                        <div className="w-64">
                                            <div className="flex justify-between text-[9px] font-black text-stone-700 uppercase mb-2 tracking-widest italic">
                                                <span>Index usage</span>
                                                <span>{usedPercent}%</span>
                                            </div>
                                            <div className="h-[2px] w-full bg-stone-900 rounded-full overflow-hidden">
                                                <div className="h-full bg-pink-600 transition-all duration-1000" style={{width: `${usedPercent}%`}}></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            <div className="masonry-grid">
                                {photos.map(p => (
                                    <div key={p.id} className="masonry-item group animate-fade" onClick={() => setSelectedPhoto(p)}>
                                        <div className="img-container flex items-center justify-center">
                                            <img 
                                                src={p.url} 
                                                className="w-full h-auto block" 
                                                onLoad={(e) => e.target.classList.add('loaded')}
                                                loading="lazy" 
                                            />
                                        </div>
                                        <div className="mt-8 flex justify-between items-start">
                                            <div>
                                                <h3 className="text-4xl font-black uppercase tracking-tighter italic mb-2 group-hover:text-pink-600 transition-colors">{p.caption}</h3>
                                                <p className="text-[10px] font-bold text-stone-500 uppercase tracking-widest italic">{p.date}</p>
                                            </div>
                                            <button onClick={(e) => { e.stopPropagation(); copyShareLink(p.id); }} className="share-btn p-3 bg-stone-900 rounded-full hover:bg-pink-600 transition-colors opacity-0 group-hover:opacity-100">
                                                <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                            </button>
                                        </div>
                                        {isAdmin && (
                                            <button onClick={e => { e.stopPropagation(); confirm("确认从云端永久移除？") && save(photos.filter(x => x.id !== p.id)); }} className="mt-6 text-[9px] font-bold text-stone-700 hover:text-red-500 uppercase tracking-widest transition-colors block underline">DELETE</button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer id="contact" className="py-72 bg-white text-center px-10">
                        <h2 className="text-7xl md:text-9xl font-black tracking-tighter italic uppercase mb-24 underline decoration-pink-600 decoration-[16px] underline-offset-8">Say Hello</h2>
                        <div className="flex flex-col md:flex-row justify-center gap-24 md:gap-48">
                            <div>
                                <p className="text-[10px] font-black text-stone-200 tracking-[0.5em] uppercase mb-4 italic">Instagram Profile</p>
                                <p className="text-4xl md:text-5xl font-black italic uppercase tracking-tighter">{contact.instagram}</p>
                            </div>
                            <div>
                                <p className="text-[10px] font-black text-stone-200 tracking-[0.5em] uppercase mb-4 italic">Direct Mail</p>
                                <p className="text-4xl md:text-5xl font-black italic uppercase tracking-tighter">{contact.email}</p>
                            </div>
                        </div>
                        <div className="mt-64 text-[10px] font-black text-stone-200 uppercase tracking-[0.5em]">
                            © 2024 LOLOLO STUDIO · ALL RIGHTS RESERVED
                        </div>
                    </footer>

                    {/* 作品预览大图 */}
                    {selectedPhoto && (
                        <div className="fixed inset-0 z-[100] bg-white flex flex-col lg:flex-row animate-fade overflow-y-auto lg:overflow-hidden">
                            <div className="absolute top-8 left-10 z-[110] flex gap-4">
                                <button onClick={() => copyShareLink(selectedPhoto.id)} className="w-14 h-14 flex items-center justify-center bg-stone-100 text-black rounded-full hover:bg-black hover:text-white transition-all shadow-lg active:scale-90">
                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                                </button>
                            </div>
                            
                            <button onClick={() => { setSelectedPhoto(null); window.history.replaceState({}, '', window.location.pathname); }} className="fixed top-8 right-8 z-[110] w-16 h-16 flex items-center justify-center bg-black text-white rounded-full font-bold text-2xl hover:bg-pink-600 transition-all shadow-xl active:scale-90">✕</button>
                            
                            <div className="flex-grow flex items-center justify-center bg-stone-50 p-8 lg:p-16 h-[60vh] lg:h-full overflow-hidden">
                                <img src={selectedPhoto.url} className="max-w-full max-h-full object-contain shadow-2xl rounded-lg" />
                            </div>
                            
                            <div className="w-full lg:w-[650px] xl:w-[800px] flex flex-col justify-center px-10 py-20 lg:py-24 bg-white lg:border-l border-stone-50">
                                <p className="text-[12px] font-black text-stone-200 tracking-[0.8em] mb-12 uppercase italic">ENTRY — {selectedPhoto.date}</p>
                                <div className="max-h-[40vh] overflow-y-auto lg:max-h-none mb-10">
                                    <h2 className="text-6xl md:text-8xl font-black uppercase tracking-tighter italic leading-[0.85] break-words text-black">
                                        {selectedPhoto.caption}
                                    </h2>
                                </div>
                                {selectedPhoto.subCaption && (
                                    <p className="text-xl md:text-2xl font-bold text-stone-400 uppercase mb-16 tracking-tight italic leading-relaxed break-words">
                                        {selectedPhoto.subCaption}
                                    </p>
                                )}
                                <div className="flex items-center gap-8 mb-20">
                                     <div className="w-20 h-[3px] bg-pink-600"></div>
                                    <span className="text-[10px] font-black text-stone-300 uppercase tracking-[0.4em] italic">PRIVATE COLLECTION</span>
                                </div>
                                <button onClick={() => { setSelectedPhoto(null); window.history.replaceState({}, '', window.location.pathname); }} className="w-full bg-black text-white py-10 rounded-[2rem] font-black uppercase text-sm tracking-[0.4em] hover:bg-pink-600 transition-all shadow-xl">Back to Gallery</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
